name: Sækja fréttir

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: RÚV
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 55 \
            -H "X-INGEST-SECRET: $INGEST_SECRET" \
            "https://news-mvp-five.vercel.app/api/ingest?source=ruv&maxTotalArticles=5")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "RÚV → $http_code: $body"

      - name: MBL
        env:
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
